# Read the Docs build of the user documentation. BioGears can't be built there, so
# documentation/conf.py publishes the tutorials as code only when READTHEDOCS is set;
# every other page builds as it does locally.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: documentation/conf.py
  fail_on_warning: true
