schema_version: 4
name: timestep-hemorrhage
title: 'BioGears time step: accuracy and speed in a hemorrhage'
investigation: biogears-timestep
created: '2026-11-16'
status: planned
question: 'How much accuracy does a 5 min right-leg hemorrhage lose, and how much wall time
  is saved, when BioGears'' solver step goes from its validated 0.02 s to 0.04 and 0.08 s?

  '
hypothesis: 'Blood volume and blood lost stay within a few mL of the 0.02 s run at 0.04 and
  0.08 s, and MAP and heart rate at 5 min within 1 mmHg and 2.5 /min, while per-second samples
  of MAP and heart rate scatter more the larger the step. 0.04 s runs about twice as fast
  and 0.08 s about three times.

  '
objective: 'Run biogears_hemorrhage (StandardMale@0s, RightLeg, 200 mL/min initial rate, 600
  s at 1 s updates) at time_step_s 0.02, 0.04 and 0.08, and compare each with the 0.02 s run.

  '
baseline:
- name: dt-0.02
  composite: viva_biogears.composites.hemorrhage.biogears_hemorrhage
  params:
    state_file: StandardMale@0s.xml
    compartment: RightLeg
    rate_mL_per_min: 200.0
    time_step_s: 0.02
    n_steps: 300
variants:
- name: dt-0.04
  composite: viva_biogears.composites.hemorrhage.biogears_hemorrhage
  parameter_overrides:
    state_file: StandardMale@0s.xml
    compartment: RightLeg
    rate_mL_per_min: 200.0
    time_step_s: 0.04
    n_steps: 300
- name: dt-0.08
  composite: viva_biogears.composites.hemorrhage.biogears_hemorrhage
  parameter_overrides:
    state_file: StandardMale@0s.xml
    compartment: RightLeg
    rate_mL_per_min: 200.0
    time_step_s: 0.08
    n_steps: 300
readouts:
- name: mean-arterial-pressure
  store_path: vitals.mean_arterial_pressure_mmHg
  units: mmHg
  status: available
- name: heart-rate
  store_path: vitals.heart_rate_bpm
  units: 1/min
  status: available
- name: blood-volume
  store_path: vitals.blood_volume_mL
  units: mL
  status: available
- name: total-blood-volume-lost
  store_path: vitals.total_blood_volume_lost_mL
  units: mL
  description: BioGears' TotalBloodLost; NaN until a bleed has started (so NaN throughout
    the rate-0 control).
  status: available
- name: cardiac-output
  store_path: vitals.cardiac_output_L_per_min
  units: L/min
  status: available
- name: irreversible-state
  store_path: vitals.irreversible_state
  description: BioGears reported an irreversible state; the engine is no longer advanced.
  status: available
- name: time-step
  store_path: engine.time_step_s
  units: s
  description: BioGears' solver step of the run (recorded so figures can tell runs apart)
units_and_time:
- quantity: time
  unit: s
  scale: 1 s per recorded row (BioGearsProcess interval 1.0)
  note: BioGears' own clock; its internal solver step is 0.02 s.
- quantity: pressures (MAP)
  unit: mmHg
  note: As reported by BioGears.
- quantity: heart rate
  unit: 1/min
  note: As reported by BioGears.
- quantity: volumes (blood volume, blood lost)
  unit: mL
  note: As reported by BioGears.
- quantity: cardiac output
  unit: L/min
  note: As reported by BioGears.
- quantity: time step
  unit: s
  note: BioGears' solver step (time_step_s); BioGears is validated at 0.02 s and fails at
    0.1 s or more.
expected_behavior:
- name: volumes-stay-accurate
  observable: vitals.blood_volume_mL, vitals.total_blood_volume_lost_mL
  condition: every sample of blood volume within 2 mL (0.04 s) and 6 mL (0.08 s) of the 0.02
    s run; blood lost at 5 min within 1 and 4 mL
  test: tests/test_timestep_hemorrhage.py::test_volumes_stay_accurate
- name: vitals-agree-at-5-min
  observable: vitals.mean_arterial_pressure_mmHg, vitals.heart_rate_bpm
  condition: MAP at 5 min within 1 mmHg and heart rate within 0.5 (0.04 s) / 2.5 (0.08 s)
    per min of the 0.02 s run
  test: tests/test_timestep_hemorrhage.py::test_vitals_agree_at_5_min
- name: scatter-grows-with-step
  observable: vitals.mean_arterial_pressure_mmHg, vitals.heart_rate_bpm
  condition: the largest per-sample deviation from the 0.02 s run is larger at 0.08 s than
    at 0.04 s, and at most 4 / 8 mmHg (MAP)
  test: tests/test_timestep_hemorrhage.py::test_scatter_grows_with_step
- name: larger-steps-run-faster
  observable: runs_meta wall time
  condition: the 0.02 s run takes at least 1.4 times as long as the 0.04 s run and 2 times
    as long as the 0.08 s run
  test: tests/test_timestep_hemorrhage.py::test_larger_steps_run_faster
visualizations:
- name: timestep-hemorrhage
  address: local:TimestepHemorrhage
  config:
    inputs_map:
      time: global_time
      time_step: engine.time_step_s
      mean_arterial_pressure: vitals.mean_arterial_pressure_mmHg
      heart_rate: vitals.heart_rate_bpm
      blood_volume: vitals.blood_volume_mL
controls:
- name: dt-0.02
  kind: negative
  hypothesis: BioGears' validated step is the reference every other arm is measured against.
  expected: Reproduces the hemorrhage-severity-sweep pilot's rate-200 run at 5 min (MAP 91.7
    mmHg, blood volume 5179 mL).
robustness:
  n_replicates: 1
  parameter_sweep: true
  note: BioGears is deterministic; wall time is not, but the ratios are large.
preregistered:
  registered_at: '2026-11-16'
  criteria:
  - tests/test_timestep_hemorrhage.py::test_reference_reproduces_the_pilot
  - tests/test_timestep_hemorrhage.py::test_each_run_used_its_time_step
  - tests/test_timestep_hemorrhage.py::test_volumes_stay_accurate
  - tests/test_timestep_hemorrhage.py::test_vitals_agree_at_5_min
  - tests/test_timestep_hemorrhage.py::test_scatter_grows_with_step
  - tests/test_timestep_hemorrhage.py::test_larger_steps_run_faster
  predictions:
  - 'Pilot (workspace/experiments/timestep-pilot-2026-11-16, every arm, the study''s composite
    and parameters): at 5 min, 0.02 / 0.04 / 0.08 s gave MAP 91.70 / 91.31 / 91.76 mmHg, heart
    rate 78.42 / 78.32 / 79.99, blood volume 5179.3 / 5180.1 / 5182.6 mL, blood lost 362.6
    / 362.0 / 360.6 mL; largest per-sample deviation from 0.02 s: MAP 2.4 / 5.3 mmHg, heart
    rate 3.3 / 6.3, blood volume 0.8 / 3.3 mL; wall time 35.9 / 17.2 / 9.6 s.'
  thresholds_provenance: Every threshold sits outside the pilot's value with margin; the pilot
    ran all three arms.
  pilot: 'All arms piloted, so these are regression checks. The study runs 5 min, not the
    severity sweep''s 10: at 0.08 s BioGears itself crashes (heap corruption, SIGABRT) about
    391 s into this bleed, in viva-biogears and in BioGears'' own bg-scenario alike (workspace/experiments/timestep-pilot-2026-11-16/bg-scenario).'
falsifiability: 'Refuted if blood volume or blood lost leaves its band, if MAP or heart rate
  at 5 min disagree beyond 1 mmHg / the per-min bands, if 0.08 s scatters less than 0.04 s,
  or if the larger steps don''t run at least 1.4 and 2 times faster.

  '
limitations:
- One bleed, one patient, 5 minutes; the 0.08 s step crashes BioGears later in this bleed
  (and 0.06 s about 29 min in), so neither is usable for long hemorrhage runs.
- Wall time comes from runs.db (runs_meta completed_at - started_at), so the speed criteria
  also time the workbench's own overhead; they are ratios, measured on whatever machine runs
  the study.
- MAP and heart rate are sampled once a second; part of the per-sample deviation is where
  in the cardiac cycle each step lands.
