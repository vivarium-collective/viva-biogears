controls:
- name: StandardMale
  kind: positive
  hypothesis: The reference patient repeats the severity sweep's rate-200 arm.
  expected: Blood volume 4888 mL and MAP 87.9 mmHg at 10 min (pilot).
robustness:
  n_replicates: 1
  parameter_sweep: false
  note: 'BioGears is deterministic. Male_25_Normal, Male_44_Normal_rr12 and Male_44_SleepDeprived
    start (and bleed) almost exactly like StandardMale: those states differ in what a 10 min
    bleed does not reach, and are kept so the cohort is every shipped state.'
preregistered:
  registered_at: '2026-11-16'
  criteria:
  - tests/test_cohort.py::test_every_shipped_patient_ran
  - tests/test_cohort.py::test_every_patient_bleeds_and_compensates
  - tests/test_cohort.py::test_smaller_patients_lose_a_larger_fraction
  - tests/test_cohort.py::test_loss_rises_with_resting_cardiac_output
  - tests/test_cohort.py::test_reference_patient_reproduces_pilot
  predictions:
  - 'Pilot (2026-11-16, all 17 states, the same composite and parameters): every patient lost
    blood (512-886 mL), MAP fell 5.5-11 mmHg and heart rate rose 6-30 /min. Fraction lost
    against starting volume: Spearman -0.54 over all 17, -0.89 over the 11 patients at 72
    /min. Volume lost against resting cardiac output: +0.68 (Male_44_Bradycardic, 4.05 L/min,
    lost 512 mL; Male_44_Tachycardic, 8.79 L/min, 886 mL).'
  thresholds_provenance: Thresholds were set below the pilot values; the pilot ran every arm,
    so they are regression checks.
  pilot: All 17 arms piloted with the canonical parameters.
falsifiability: 'Refuted if any patient does not lose blood, lose blood volume, raise heart
  rate and lose MAP; if the fraction lost does not fall with starting blood volume (rho >
  -0.4, or > -0.7 among the 72 /min patients); or if the volume lost does not rise with resting
  cardiac output (rho < 0.5).

  '
limitations:
- One site, one rate, 10 minutes.
- 'BioGears'' shipped states are not a designed cohort: body size, heart rate and conditions
  vary together, so the two correlations are not independent.'
