schema_version: 4
name: patient-cohort
title: Hemorrhage across BioGears' shipped patients
investigation: biogears-hemorrhage
created: '2026-11-16'
status: planned
question: 'Does the same right-leg bleed behave the same in each of the 17 patient states
  shipped with BioGears 8.2.0, and what sets how much blood each loses? (The viva-pulse study
  of the same name, ported to BioGears.)

  '
hypothesis: 'Every patient compensates the same way (blood volume and MAP fall, heart rate
  rises). Smaller patients lose a larger fraction of their blood, as in Pulse, but less cleanly:
  in BioGears the volume lost also rises with the patient''s resting cardiac output, so the
  fast-heart-rate patients lose more.

  '
objective: 'Run biogears_hemorrhage (RightLeg, 200 mL/min initial rate, 600 s) from each shipped
  <name>@0s.xml state (the DefaultTemplate states excluded).

  '
baseline:
- name: StandardMale
  composite: viva_biogears.composites.hemorrhage.biogears_hemorrhage
  params:
    state_file: StandardMale@0s.xml
    compartment: RightLeg
    rate_mL_per_min: 200.0
    n_steps: 600
