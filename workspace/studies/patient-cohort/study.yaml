readouts:
- name: mean-arterial-pressure
  store_path: vitals.mean_arterial_pressure_mmHg
  units: mmHg
  status: available
- name: heart-rate
  store_path: vitals.heart_rate_bpm
  units: 1/min
  status: available
- name: blood-volume
  store_path: vitals.blood_volume_mL
  units: mL
  status: available
- name: total-blood-volume-lost
  store_path: vitals.total_blood_volume_lost_mL
  units: mL
  description: BioGears' TotalBloodLost; NaN until a bleed has started (so NaN throughout
    the rate-0 control).
  status: available
- name: cardiac-output
  store_path: vitals.cardiac_output_L_per_min
  units: L/min
  status: available
- name: irreversible-state
  store_path: vitals.irreversible_state
  description: BioGears reported an irreversible state; the engine is no longer advanced.
  status: available
units_and_time:
- quantity: time
  unit: s
  scale: 1 s per recorded row (BioGearsProcess interval 1.0)
  note: BioGears' own clock; its internal solver step is 0.02 s.
- quantity: pressures (MAP)
  unit: mmHg
  note: As reported by BioGears.
- quantity: heart rate
  unit: 1/min
  note: As reported by BioGears.
- quantity: volumes (blood volume, blood lost)
  unit: mL
  note: As reported by BioGears.
- quantity: cardiac output
  unit: L/min
  note: As reported by BioGears.
expected_behavior:
- name: every-patient-compensates
  observable: vitals.blood_volume_mL, vitals.heart_rate_bpm, vitals.mean_arterial_pressure_mmHg
  condition: in all 17 patients blood is lost, blood volume and MAP fall and heart rate rises
  test: tests/test_cohort.py::test_every_patient_bleeds_and_compensates
- name: smaller-patients-lose-larger-fraction
  observable: vitals.total_blood_volume_lost_mL / initial vitals.blood_volume_mL
  condition: Spearman rank correlation with starting blood volume <= -0.4 over all patients
    and <= -0.7 over the patients with a resting heart rate of 72 /min
  test: tests/test_cohort.py::test_smaller_patients_lose_a_larger_fraction
- name: loss-tracks-cardiac-output
  observable: vitals.total_blood_volume_lost_mL, initial vitals.cardiac_output_L_per_min
  condition: Spearman rank correlation of the volume lost with resting cardiac output >= 0.5
  test: tests/test_cohort.py::test_loss_rises_with_resting_cardiac_output
visualizations:
- name: cohort-blood-loss
  address: local:CohortBloodLoss
  config:
    inputs_map:
      blood_volume: vitals.blood_volume_mL
      hemorrhaged_volume: vitals.total_blood_volume_lost_mL
      mean_arterial_pressure: vitals.mean_arterial_pressure_mmHg
