schema_version: 4
name: mcdaniel-2019-sepsis
title: Sepsis progression by infection severity (McDaniel et al. 2019, Figs 4-7)
investigation: mcdaniel-2019
created: '2026-11-03'
status: planned
question: 'Does BioGears 8.2.0, driven through viva-biogears, reproduce the sepsis progression
  McDaniel et al. (2019) report for BioGears'' infection model: the inflammatory response
  ordered by infection severity (Figs 4-5), and the timing of hyperlactatemia, hypotension
  and septic shock in a severe untreated infection (Figs 6-7)?

  '
hypothesis: 'Peak pathogen and cytokine levels rise, and tissue integrity falls, from mild
  to moderate to severe infection. Only the severe arm decompensates: lactate exceeds 2 mM
  after about 20 h and SBP falls below 100 mmHg at about 26 h, as in the paper. Unlike
  the paper, MAP is not expected to reach 65 mmHg (septic shock) by 48 h on 8.2.0.

  '
objective: 'Run biogears_sepsis for 48 h at 60 s updates (StandardMale@0s, Skin infection,
  MIC 16 mg/L, BioGears'' InfectionModerate water and meal schedule) with no infection
  and with mild, moderate and severe infection, and compare the inflammatory and clinical
  readings.

  '
literature_anchors:
- expectation: 'Fig 4-5: the inflammatory response (pathogen, TNF, IL-6, IL-10, NO) rises
    with infection severity'
  model_observable: readings.infection.inflammation.*, peak per arm
  cite: mcdaniel2019
  status_in_workspace: Available (readouts recorded)
- expectation: 'Figs 6-7: severe infection, lactate > 2 mM after about 20 h'
  model_observable: readings.infection.clinical.lactate_mmol_per_L
  cite: mcdaniel2019
  status_in_workspace: Available (readouts recorded)
- expectation: 'Figs 6-7: SBP < 100 mmHg at about 26 h, sepsis at about 30 h, septic shock
    (MAP < 65, lactate > 2 mM) at about 45 h'
  model_observable: readings.infection.clinical (SBP, MAP, lactate, respiration rate)
  cite: mcdaniel2019
  status_in_workspace: Available (readouts recorded)
- expectation: 'Fig 6: SVR falls toward 60 % of baseline'
  model_observable: readings.infection.clinical.systemic_vascular_resistance_mmHg_s_per_mL
  cite: mcdaniel2019
  status_in_workspace: Available (readouts recorded)
baseline:
- name: control
  composite: viva_biogears.composites.sepsis.biogears_sepsis
  params:
    severity: none
    nutrition: infection_scenario
    interval: 60.0
    n_steps: 2880
variants:
- name: mild
  composite: viva_biogears.composites.sepsis.biogears_sepsis
  parameter_overrides:
    severity: mild
    nutrition: infection_scenario
    interval: 60.0
    n_steps: 2880
- name: moderate
  composite: viva_biogears.composites.sepsis.biogears_sepsis
  parameter_overrides:
    severity: moderate
    nutrition: infection_scenario
    interval: 60.0
    n_steps: 2880
- name: severe
  composite: viva_biogears.composites.sepsis.biogears_sepsis
  parameter_overrides:
    severity: severe
    nutrition: infection_scenario
    interval: 60.0
    n_steps: 2880
runtime:
  note: 48 simulated hours take about 8 h of wall time per arm (BioGears runs about 6x
    real time). run.py in this folder runs the same arms outside the workbench, with
    4 h checkpoints and resume, and analyze.py draws the paper's figures from its output.
readouts:
- {name: blood-pathogen, store_path: readings.infection.inflammation.blood_pathogen, units: arbitrary}
- {name: local-pathogen, store_path: readings.infection.inflammation.local_pathogen, units: arbitrary}
- {name: tnf, store_path: readings.infection.inflammation.tumor_necrosis_factor, units: arbitrary}
- {name: il6, store_path: readings.infection.inflammation.interleukin_6, units: arbitrary}
- {name: il10, store_path: readings.infection.inflammation.interleukin_10, units: arbitrary}
- {name: nitric-oxide, store_path: readings.infection.inflammation.nitric_oxide, units: arbitrary}
- {name: tissue-integrity, store_path: readings.infection.inflammation.tissue_integrity, units: fraction}
- {name: heart-rate, store_path: readings.infection.clinical.heart_rate_bpm, units: 1/min}
- {name: respiration-rate, store_path: readings.infection.clinical.respiration_rate_bpm, units: 1/min}
- {name: core-temperature, store_path: readings.infection.clinical.core_temperature_C, units: degC}
- {name: white-blood-cells, store_path: readings.infection.clinical.white_blood_cell_count_per_uL, units: count/uL}
- {name: systolic-pressure, store_path: readings.infection.clinical.systolic_pressure_mmHg, units: mmHg}
- {name: mean-arterial-pressure, store_path: readings.infection.clinical.mean_arterial_pressure_mmHg, units: mmHg}
- {name: systemic-vascular-resistance, store_path: readings.infection.clinical.systemic_vascular_resistance_mmHg_s_per_mL,
  units: mmHg s/mL}
- {name: cardiac-output, store_path: readings.infection.clinical.cardiac_output_L_per_min, units: L/min}
- {name: blood-volume, store_path: readings.infection.clinical.blood_volume_mL, units: mL}
- {name: mean-urine-output, store_path: readings.infection.clinical.mean_urine_output_mL_per_min, units: mL/min}
- {name: lactate, store_path: readings.infection.clinical.lactate_mmol_per_L, units: mmol/L}
- {name: lymph-return, store_path: readings.lymph.return_mL_per_min, units: mL/min}
- {name: extravascular-fluid, store_path: readings.tissue_fluid.extravascular_fluid_mL, units: mL}
- name: irreversible-state
  store_path: readings.irreversible_state
  description: BioGears reported an irreversible state; the engine is no longer advanced.
units_and_time:
- quantity: time
  unit: s
  scale: one recorded row per 60 s update (n_steps 2880 = 48 h)
  note: BioGears' own clock; its internal solver step is 0.02 s.
- quantity: inflammation
  unit: arbitrary
  note: BioGears' InflammatoryResponse state variables, as plotted in the paper.
expected_behavior:
- name: severity-orders-the-response
  observable: readings.infection.inflammation (blood_pathogen, tumor_necrosis_factor,
    interleukin_6, tissue_integrity)
  condition: peak pathogen, TNF and IL-6 strictly increase, and the lowest tissue integrity
    strictly decreases, from mild to moderate to severe; the control has no pathogen
  test: tests/test_progression.py::test_severity_orders_the_inflammatory_response, test_lowest_tissue_integrity_falls_with_severity
- name: only-severe-decompensates
  observable: readings.infection.clinical (lactate, SBP)
  condition: mild and moderate never sustain lactate > 2 mM or SBP < 100 mmHg; severe
    does, lactate first between 12 and 24 h and SBP between 22 and 32 h
  test: tests/test_progression.py::test_mild_and_moderate_stay_compensated, test_severe_lactate_onset,
    test_severe_hypotension_onset
- name: severe-hypovolemia
  observable: readings.infection.clinical (blood_volume_mL, heart_rate_bpm)
  condition: severe ends with at least 1000 mL less blood volume and a heart rate above
    100 /min
  test: tests/test_progression.py::test_severe_loses_volume_and_turns_tachycardic
visualizations:
- name: sepsis-progression
  address: local:SepsisProgression
  config:
    inputs_map:
      time: global_time
      blood_pathogen: readings.infection.inflammation.blood_pathogen
      tissue_integrity: readings.infection.inflammation.tissue_integrity
      mean_arterial_pressure: readings.infection.clinical.mean_arterial_pressure_mmHg
      systolic_pressure: readings.infection.clinical.systolic_pressure_mmHg
      lactate: readings.infection.clinical.lactate_mmol_per_L
      blood_volume: readings.infection.clinical.blood_volume_mL
controls:
- name: control
  kind: negative
  hypothesis: Without infection the water and meal schedule alone leaves the patient
    stable.
  expected: No blood pathogen; lactate below 2 mM and MAP above 85 mmHg throughout.
- name: severe
  kind: positive
  hypothesis: The severe infection is the paper's septic arm; it must decompensate for
    the readouts to show anything.
  expected: Sustained lactate > 2 mM and SBP < 100 mmHg within 48 h.
robustness:
  n_replicates: 1
  parameter_sweep: true
  note: BioGears is deterministic.
preregistered:
  registered_at: '2026-11-16'
  criteria:
  - tests/test_progression.py::test_control_stays_uninfected_and_stable
  - tests/test_progression.py::test_severity_orders_the_inflammatory_response
  - tests/test_progression.py::test_lowest_tissue_integrity_falls_with_severity
  - tests/test_progression.py::test_mild_and_moderate_stay_compensated
  - tests/test_progression.py::test_severe_lactate_onset
  - tests/test_progression.py::test_severe_hypotension_onset
  - tests/test_progression.py::test_severe_loses_volume_and_turns_tachycardic
  - tests/test_progression.py::test_severe_does_not_reach_septic_shock_by_48_h
  predictions:
  - 'Paper (BioGears ~7.3): severe lactate > 2 mM after about 20 h, SBP < 100 mmHg at
    about 26 h, sepsis at about 30 h, septic shock (MAP < 65 and lactate > 2 mM) at about
    45 h, SVR falling toward 60 % of baseline.'
  - 'Pilot (2026-11-14, bg-scenario on BioGears 8.2.0 with the same infection, patient
    and meal schedule, Scenarios/Patient/Fig4_*.xml, 20 s sampling): severe lactate >
    2 mM (sustained 30 min) at 16.5 h and SBP < 100 at 26.8 h; MAP 95.9 -> 72.4 mmHg
    at 48 h (never < 65); SVR never below 95 % of baseline; mean urine output never below
    1.2 mL/min; blood volume 5530 -> 3890 mL; heart rate 72 -> 113. Mild and moderate
    never reached lactate 2 mM or SBP 100. Peak blood pathogen 6.3 / 8.7 / 60.5, TNF 0.123
    / 0.133 / 0.140, IL-6 0.53 / 0.80 / 1.06, lowest tissue integrity 0.968 / 0.762 /
    0.325 for mild / moderate / severe.'
  thresholds_provenance: Onset windows are centred on the paper's times and include the
    bg-scenario pilot's; the orderings and the shock criterion come from that pilot.
  pilot: The pilot ran the infected arms in bg-scenario, not through viva-biogears (pybiogears
    matches bg-scenario, probe P4). The control arm was not piloted.
falsifiability: 'Refuted if the inflammatory peaks are not ordered by severity, if mild
  or moderate infection decompensates, if the severe arm never sustains lactate > 2 mM
  or SBP < 100 mmHg, or if those onsets fall outside 12-24 h and 22-32 h. The last criterion
  records a known divergence from the paper (no septic shock by 48 h); it fails, and so
  flags a change, if a later BioGears does reach shock.

  '
limitations:
- One patient and one infection site; the paper's inflammation-parameter sensitivity analysis
  (Fig 8) changes constants inside BioGears and is not reproducible without modifying
  it.
- The paper's code predates 8.2.0 by 93 commits to BloodChemistry.cpp and Tissue.cpp,
  so differences mix model drift with anything the paper doesn't describe.
- Sepsis (SBP < 100 and tachypnea) is not tested; the paper does not give its tachypnea
  threshold.
