schema_version: 4
name: hemorrhage-severity-sweep
title: Hemorrhage severity sweep (BioGears)
investigation: biogears-hemorrhage
created: '2026-11-16'
status: planned
question: 'How do blood loss, heart rate and mean arterial pressure over 10 minutes
  depend on the initial rate of a right-leg hemorrhage in the BioGears StandardMale?

  '
hypothesis: 'Blood lost and heart rate rise monotonically with the initial bleed rate
  and MAP falls monotonically with it. BioGears''
  baroreflex does not hold MAP within 2 mmHg of its start for any of these bleeds. Loss
  grows much more slowly than the commanded rate, because BioGears lowers a bleed''s
  rate as the local pressure falls.

  '
objective: 'Run biogears_hemorrhage for 600 s at initial rates 0, 50, 100, 150, 200
  and 250 mL/min (RightLeg, StandardMale@0s) and compare the final vitals across the
  grid.

  '
baseline:
- name: rate-200
  composite: viva_biogears.composites.hemorrhage.biogears_hemorrhage
  params:
    state_file: StandardMale@0s.xml
    compartment: RightLeg
    rate_mL_per_min: 200.0
    n_steps: 600
variants:
- name: rate-0
  composite: viva_biogears.composites.hemorrhage.biogears_hemorrhage
  parameter_overrides:
    state_file: StandardMale@0s.xml
    compartment: RightLeg
    rate_mL_per_min: 0.0
    n_steps: 600
- name: rate-50
  composite: viva_biogears.composites.hemorrhage.biogears_hemorrhage
  parameter_overrides:
    state_file: StandardMale@0s.xml
    compartment: RightLeg
    rate_mL_per_min: 50.0
    n_steps: 600
- name: rate-100
  composite: viva_biogears.composites.hemorrhage.biogears_hemorrhage
  parameter_overrides:
    state_file: StandardMale@0s.xml
    compartment: RightLeg
    rate_mL_per_min: 100.0
    n_steps: 600
- name: rate-150
  composite: viva_biogears.composites.hemorrhage.biogears_hemorrhage
  parameter_overrides:
    state_file: StandardMale@0s.xml
    compartment: RightLeg
    rate_mL_per_min: 150.0
    n_steps: 600
- name: rate-250
  composite: viva_biogears.composites.hemorrhage.biogears_hemorrhage
  parameter_overrides:
    state_file: StandardMale@0s.xml
    compartment: RightLeg
    rate_mL_per_min: 250.0
    n_steps: 600
readouts:
- name: mean-arterial-pressure
  store_path: vitals.mean_arterial_pressure_mmHg
  units: mmHg
  status: available
- name: heart-rate
  store_path: vitals.heart_rate_bpm
  units: 1/min
  status: available
- name: blood-volume
  store_path: vitals.blood_volume_mL
  units: mL
  status: available
- name: total-blood-volume-lost
  store_path: vitals.total_blood_volume_lost_mL
  units: mL
  description: BioGears' TotalBloodLost; NaN until a bleed has started (so NaN throughout
    the rate-0 control).
  status: available
- name: cardiac-output
  store_path: vitals.cardiac_output_L_per_min
  units: L/min
  status: available
- name: irreversible-state
  store_path: vitals.irreversible_state
  description: BioGears reported an irreversible state; the engine is no longer advanced.
  status: available
- name: hemorrhage-rate
  store_path: interventions.hemorrhage_rate_mL_per_min
  units: mL/min
  description: Initial bleed-rate setpoint sent to the engine (recorded so figures read
    it from the run).
  status: available
units_and_time:
- quantity: time
  unit: s
  scale: 1 s per recorded row (BioGearsProcess interval 1.0)
  note: BioGears' own clock; its internal solver step is 0.02 s.
- quantity: pressures (MAP)
  unit: mmHg
  note: As reported by BioGears.
- quantity: heart rate
  unit: 1/min
  note: As reported by BioGears.
- quantity: volumes (blood volume, blood lost)
  unit: mL
  note: As reported by BioGears.
- quantity: cardiac output
  unit: L/min
  note: As reported by BioGears.
- quantity: bleed rate
  unit: mL/min
  note: The initial rate of BioGears' hemorrhage action; BioGears then scales it with
    the compartment pressure.
expected_behavior:
- name: blood-loss-rises-with-rate
  observable: vitals.total_blood_volume_lost_mL
  condition: final value strictly increasing over rates 50 to 250 mL/min, final blood
    volume strictly decreasing over 0 to 250
  test: tests/test_severity.py::test_blood_loss_rises_with_rate
- name: pressure-falls-with-rate
  observable: vitals.mean_arterial_pressure_mmHg
  condition: final MAP strictly decreasing over 0 to 250 mL/min; every bleeding arm
    leaves the 2 mmHg band around its start; at 250 mL/min at least 7 mmHg below start
  test: tests/test_severity.py::test_pressure_falls_with_rate, test_every_bleed_leaves_the_band,
    test_pressure_falls_for_the_fastest_bleed
- name: loss-is-sublinear-in-rate
  observable: vitals.total_blood_volume_lost_mL
  condition: blood lost at 250 mL/min is less than 3 times that at 50 mL/min
  test: tests/test_severity.py::test_loss_grows_more_slowly_than_the_rate
visualizations:
- name: severity-response
  address: local:HemorrhageSeverityResponse
  config:
    inputs_map:
      time: global_time
      bleed_rate: interventions.hemorrhage_rate_mL_per_min
      mean_arterial_pressure: vitals.mean_arterial_pressure_mmHg
      heart_rate: vitals.heart_rate_bpm
      hemorrhaged_volume: vitals.total_blood_volume_lost_mL
robustness:
  n_replicates: 1
  parameter_sweep: true
  note: BioGears is deterministic (pybiogears probe P5); one run per rate.
controls:
- name: rate-0
  kind: negative
  hypothesis: With no bleed nothing is lost and the vitals stay at their loaded values.
  expected: No blood lost (the readout stays NaN); MAP and heart rate within 1 unit
    of their starting values; blood volume within 30 mL.
- name: rate-250
  kind: positive
  hypothesis: The fastest bleed produces the largest loss and the deepest pressure fall,
    confirming the readouts respond when the effect is certainly present.
  expected: The largest blood loss of the sweep and the lowest MAP, at least 7 mmHg below
    its start.
preregistered:
  registered_at: '2026-11-16'
  criteria:
  - tests/test_severity.py::test_no_bleed_control_is_flat
  - tests/test_severity.py::test_blood_loss_rises_with_rate
  - tests/test_severity.py::test_heart_rate_rises_with_rate
  - tests/test_severity.py::test_pressure_falls_with_rate
  - tests/test_severity.py::test_every_bleed_leaves_the_band
  - tests/test_severity.py::test_pressure_falls_for_the_fastest_bleed
  - tests/test_severity.py::test_loss_grows_more_slowly_than_the_rate
  - tests/test_severity.py::test_blood_lost_bounds_the_volume_drop
  - tests/test_severity.py::test_reproduces_pilot
  predictions:
  - 'Pilot (workspace/experiments/hemorrhage-pilot-2026-11-16, biogears_hemorrhage run directly for 600 s, BioGears 8.2.0):
    rates 0 / 50 / 100 / 150 / 200 / 250 mL/min lost - / 337 / 508 / 611 / 679 / 728
    mL; heart rate 72.1 / 78.0 / 81.5 / 83.9 / 85.4 / 86.9 bpm; MAP 96.2 / 92.1 / 90.3
    / 88.9 / 87.9 / 87.3 mmHg from 95.9; blood volume 5549 / 5220 / 5054 / 4954 / 4888
    / 4840 mL from 5532. Every bleeding arm first left the 2 mmHg band at 293 / 189 /
    153 / 135 / 123 s.'
  thresholds_provenance: Every threshold comes from that pilot, which ran each arm of
    this study with the same composite and parameters; the canonical runs repeat it
    through the workbench.
  pilot: 'The pilot ran all six arms, so these criteria are regression checks on BioGears''
    behaviour, not blind predictions. No bleed here keeps MAP within 2 mmHg, so the
    criterion is that every bleed leaves the band; and the loss saturates with rate.'
falsifiability: 'Refuted if blood loss, heart rate or the MAP fall fails to increase
  with the initial rate, if any bleeding arm keeps MAP within 2 mmHg of its start,
  if MAP at 250 mL/min is not at least 7 mmHg below its start, or if loss scales in
  proportion to the commanded rate (250 mL/min losing 3 or more times what 50 mL/min
  does).

  '
limitations:
- One patient (StandardMale), one site (RightLeg) and 10 minutes.
- The rate is BioGears' initial bleed rate, not a constant flow; BioGears lowers it with
  the compartment pressure, so the setpoint is not the delivered flow.
- Thresholds trace to a deterministic pilot of the same arms, not to physiology data.
