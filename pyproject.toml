[project]
name = "viva-biogears"
version = "0.1.0"
description = "Process-bigraph wrapper for the BioGears physiology engine (8.2.0, via pybiogears)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# BioGears and pybiogears are not on PyPI: build them with pybiogears'
# scripts/install_biogears.sh and install pybiogears into this venv (see
# README.md). Engine tests skip when no build is found.
dependencies = [
    # 1.10.1: initial_state() is kept on overwrite[float] and boolean output ports
    # (process-bigraph #268); the vitals ports rely on it (viva-pulse found this).
    "process-bigraph>=1.10.1",
    "bigraph-schema>=1.8.3",
    "numpy",
    # (The template's floor for process-bigraph, 1.8.5, for composite
    # core_extensions and the emitter fix #217, is covered by 1.10.1 above.)
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    # Web-based workspace dashboard (server + templates + assets + lib helpers).
    # Extracted from viva-template as of v0.4.16; provides the `vivarium-workbench
    # serve` CLI invoked by scripts/serve.sh.
    "vivarium-workbench",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
cli = ["typer", "rich"]

[project.scripts]
biogears = "viva_biogears.cli.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license expression
build-backend = "hatchling.build"

# Allow ecosystem git-direct-reference deps (viva-superpowers / vivarium-workbench
# @ git+https://…) that workspaces commonly add — hatchling rejects them otherwise.
[tool.hatch.metadata]
allow-direct-references = true

# Declare the workspace Python package explicitly so this workspace is
# pip-installable (e.g. `pip install git+<repo>@<sha>`).  sms-api injects it
# as an extra_pip_dep so the container runner can import the workspace's
# processes from a committed + pushed git ref.
[tool.hatch.build.targets.wheel]
packages = ["viva_biogears"]
