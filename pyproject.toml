[project]
name = "viva-biogears"
version = "0.1.0"
description = "Process-bigraph wrapper for the BioGears physiology engine (8.2.0, via pybiogears)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# BioGears and pybiogears are not on PyPI. Build BioGears with pybiogears'
# scripts/install_biogears.sh, then install the `engine` extra, which builds
# pybiogears against it (see README.md). Engine tests skip when no build is found.
dependencies = [
    # 1.10.1: initial_state() is kept on overwrite[float] and boolean output ports
    # (process-bigraph #268); the vitals ports rely on it.
    "process-bigraph>=1.10.1",
    # <1.8.4: bigraph-schema 1.8.4 (2026-11-20) lacks bigraph_schema.matching, which
    # process-bigraph 1.11.0 imports, so process_bigraph fails to import.
    "bigraph-schema>=1.8.3,<1.8.4",
    "numpy",
    "platformdirs>=3",
    # (The template's floor for process-bigraph, 1.8.5, for composite
    # core_extensions and the emitter fix #217, is covered by 1.10.1 above.)
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    # core.build_core() composes cores with viva_superpowers.core_compose. It came
    # only through the workbench before. 0.24 is the oldest tested here; 0.26 (what
    # inflect-sim-core resolves) and 0.28 provide it unchanged.
    "viva-superpowers>=0.24",
]

[project.optional-dependencies]
# The web-based workspace dashboard (`vivarium-workbench serve`, scripts/serve.sh).
# An extra, not a core dependency, so a project that uses viva-biogears as a library
# can bring its own workbench: an exact pin here made such a project unresolvable
# (inflect-sim-core pins workbench 0.5.3 from git). Pinned: every release from 0.4
# needs viva-basic-processes, which is not on PyPI, so an unpinned requirement
# resolved to 0.3.92 anyway, without saying so.
workbench = ["vivarium-workbench==0.3.92"]
dev = ["viva-biogears[workbench]", "pytest>=7.4"]
# The real engine: pybiogears, built against a BioGears 8.2.0 install
# (CMAKE_PREFIX_PATH=<install> uv pip install -e '.[engine]'), at the commit this
# repo is tested with.
engine = ["pybiogears @ git+https://github.com/vivarium-collective/pybiogears.git@01db2efc3db1aaae5a01cf8f1ccef725c60d0c30"]
cli = ["typer", "rich"]

[project.scripts]
biogears = "viva_biogears.cli.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license expression
build-backend = "hatchling.build"

# Allow ecosystem git-direct-reference deps (viva-superpowers / vivarium-workbench
# @ git+https://…) that workspaces commonly add — hatchling rejects them otherwise.
# The user documentation (`make docs`); its tutorials run the real engine, so it
# builds in this project's venv: `uv pip install --group docs`.
[dependency-groups]
docs = [
    "furo>=2025.12.19",
    "ipykernel>=7.4.0",
    "matplotlib",
    "myst-nb>=1.4.0",
    "sphinx>=8.2",
]

[tool.hatch.metadata]
allow-direct-references = true

# Declare the workspace Python package explicitly so this workspace is
# pip-installable (e.g. `pip install git+<repo>@<sha>`).  sms-api injects it
# as an extra_pip_dep so the container runner can import the workspace's
# processes from a committed + pushed git ref.
[tool.hatch.build.targets.wheel]
packages = ["viva_biogears"]

# The package's tests. Each study's criteria (workspace/studies/*/tests) are run by the
# workbench against its recorded runs, and one shares a module name with tests/test_treatment.py.
[tool.pytest.ini_options]
testpaths = ["tests"]
